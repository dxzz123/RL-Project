[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-charging-env"
version = "0.1.1"
description = "Two-stage pricing and dispatch simulator for fixed and mobile EV charging"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "gymnasium>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]
